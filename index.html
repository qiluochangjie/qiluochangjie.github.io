          dropMax: 3,
          unlockCost: 0
        },
        cabbage: {
          name: '白菜',
          emoji: '🥬',
          stages: ['🌰', '🌱', '🌿', '🥬'],
          growthTime: 4 * 60 * 1000,
          cost: 15,
          value: 40,
          color: '#27ae60',
          dropMin: 1,
          dropMax: 3,
          unlockCost: 80
        },
        strawberry: {
          name: '草莓',
          emoji: '🍓',
          stages: ['🌰', '🌱', '🌿', '🍓'],
          growthTime: 5 * 60 * 1000,
          cost: 25,
          value: 60,
          color: '#e74c3c',
          dropMin: 1,
          dropMax: 3,
          unlockCost: 200
        },
        corn: {
          name: '玉米',
          emoji: '🌽',
          stages: ['🌰', '🌱', '🌿', '🌽'],
          growthTime: 4.5 * 60 * 1000,
          cost: 20,
          value: 50,
          color: '#f1c40f',
          dropMin: 1,
          dropMax: 3,
          unlockCost: 400
        },
        tomato: {
          name: '番茄',
          emoji: '🍅',
          stages: ['🌰', '🌱', '🌿', '🍅'],
          growthTime: 6 * 60 * 1000,
          cost: 30,
          value: 80,
          color: '#e74c3c',
          dropMin: 1,
          dropMax: 2,
          unlockCost: 700
        },
        pumpkin: {
          name: '南瓜',
          emoji: '🎃',
          stages: ['🌰', '🌱', '🌿', '🎃'],
          growthTime: 8 * 60 * 1000,
          cost: 40,
          value: 120,
          color: '#e67e22',
          dropMin: 1,
          dropMax: 2,
          unlockCost: 1200
        },
        grape: {
          name: '葡萄',
          emoji: '🍇',
          stages: ['🌰', '🌱', '🌿', '🍇'],
          growthTime: 5.5 * 60 * 1000,
          cost: 35,
          value: 95,
          color: '#9b59b6',
          dropMin: 1,
          dropMax: 2,
          unlockCost: 2000
        }
      };

      const ANIMALS = {
        chicken: { name:'鸡', emoji:'🐔', cost:25, breedTime:30*1000, produceType:'egg', produceName:'鸡蛋', produceEmoji:'🥚', produceInterval:60*1000, produceValue:10, slaughterName:'鸡肉', slaughterEmoji:'🍗', slaughterValue:30, furType:null, unlockCost:0 },
        pig: { name:'猪', emoji:'🐷', cost:60, breedTime:40*1000, produceType:null, produceName:null, produceEmoji:null, produceInterval:null, produceValue:0, slaughterName:'猪肉', slaughterEmoji:'🥩', slaughterValue:80, furType:null, unlockCost:150 },
        cow: { name:'牛', emoji:'🐮', cost:80, breedTime:50*1000, produceType:'milk', produceName:'牛奶', produceEmoji:'🥛', produceInterval:90*1000, produceValue:20, slaughterName:'牛肉', slaughterEmoji:'🥩', slaughterValue:120, furType:null, unlockCost:400 },
        sheep: { name:'羊', emoji:'🐑', cost:50, breedTime:40*1000, produceType:'wool', produceName:'羊毛', produceEmoji:'🧶', produceInterval:90*1000, produceValue:18, slaughterName:'羊肉', slaughterEmoji:'🥩', slaughterValue:70, furType:'wool', unlockCost:250 }
      };

      const WEATHER = {
        sunny: { label: '晴天', icon: '☀️', sky: '#4a90d9', multiplier: 1, particle: 'none' },
        rainy: { label: '雨天', icon: '🌧️', sky: '#5b6e82', multiplier: 1.5, particle: 'rain', particleCount: 40 },
        snowy: { label: '雪天', icon: '❄️', sky: '#b0bec5', multiplier: 0.5, particle: 'snow', particleCount: 25 },
        stormy: { label: '雷暴', icon: '⛈️', sky: '#3d3d5c', multiplier: 1.5, particle: 'rain', particleCount: 40 }
      };

      const MAX_PLOTS = 20; // 5列 x 4行
      const INITIAL_UNLOCKED = 6;
      const BASE_UNLOCK_COST = 100;
      const UNLOCK_COST_MULTIPLIER = 2;
      const RANCH_MAX_PLOTS = 10; // 5列 x 2行
      const RANCH_INITIAL_UNLOCKED = 3;
      const RANCH_BASE_UNLOCK_COST = 150;
      const RANCH_UNLOCK_COST_MULTIPLIER = 2;
      const RANCH_MAX_PER_PLOT = 6;
      const BREED_COOLDOWN = 30 * 1000; // 30秒冷却
      const SAVE_KEY = 'weatherFarm_extended_v3';
      const WEATHER_CACHE_TTL = 30 * 60 * 1000;

      const BUILDINGS = [
        { left: 20, width: 40, height: 60, color: '#34495e' },
        { left: 70, width: 50, height: 85, color: '#2c3e50' },
        { left: 130, width: 35, height: 50, color: '#3d566e' },
        { left: 175, width: 55, height: 75, color: '#2c3e50' },
        { left: 240, width: 45, height: 55, color: '#34495e' },
        { left: 295, width: 25, height: 40, color: '#3d566e' }
      ];

      const ACHIEVEMENTS = [
        { id: 'first_harvest', name: '初次收获', icon: '🌾', desc: '收获第一个作物', check: s => s.totalHarvested >= 1 },
        { id: 'rich', name: '小富即安', icon: '💰', desc: '攒到 200 金币', check: s => s.coins >= 200 },
        { id: 'rich_richer', name: '富甲一方', icon: '💎', desc: '攒到 500 金币', check: s => s.coins >= 500 },
        { id: 'huge_harvest', name: '大丰收', icon: '📦', desc: '累计收获 30 个作物', check: s => s.totalHarvested >= 30 },
        { id: 'star_harvest', name: '星光收获', icon: '⭐', desc: '收获一个优质品质作物', check: s => Object.values(s.storage).some(q => q.star > 0) },
        { id: 'diamond_harvest', name: '极品时刻', icon: '✨', desc: '收获一个极品品质作物', check: s => Object.values(s.storage).some(q => q.diamond > 0) },
        { id: 'collection', name: '收藏家', icon: '🏆', desc: '每种作物各收获≥3个', check: s => Object.values(CROPS).every(c => (s.storage[c.name].normal + s.storage[c.name].star + s.storage[c.name].diamond) >= 3) },
        { id: 'land_buyer', name: '地主', icon: '🏡', desc: '解锁全部地块', check: s => s.unlockedPlots >= MAX_PLOTS },
        { id: 'first_animal', name: '牧场初建', icon: '🐮', desc: '购买第一只动物', check: s => s.ranchPlots.some(p => p.animalType && p.animals.length > 0) },
        { id: 'ranch_master', name: '牧场达人', icon: '🐄', desc: '解锁全部牧场栏位', check: s => s.ranchUnlockedPlots >= RANCH_MAX_PLOTS },
        { id: 'ranch_harvest', name: '牧场丰收', icon: '🥛', desc: '累计收获 20 个动物产物', check: s => s.totalRanchHarvested >= 20 },
        { id: 'breeder', name: '繁育者', icon: '🐣', desc: '成功繁殖一次动物', check: s => s.ranchPlots.filter(p => p.animalType && p.animals.length >= 3).length >= 1 },
        { id: 'butcher', name: '屠夫', icon: '🔪', desc: '宰杀 5 只动物', check: s => s.totalRanchHarvested >= 5 && Object.values(s.ranchStorage).some(q => (q.normal + q.star + q.diamond) >= 3) }
      ];

      const QUALITY_MAP = {
        normal: { label: '', emoji: '', multiplier: 1 },
        star: { label: '优质', emoji: '⭐', multiplier: 2 },
        diamond: { label: '极品', emoji: '💎', multiplier: 5 }
      };

      // ============================================================
      // 工具函数
      // ============================================================
      const $ = (sel, ctx = document) => ctx.querySelector(sel);
      const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

      function rollQuality() {
        const r = Math.random();
        if (r < 0.05) return 'diamond';
        if (r < 0.25) return 'star';
        return 'normal';
      }

      function getGameHour(state) {
        const gameMinutes = (Date.now() - state.gameEpoch) / 1000;
        return ((gameMinutes / 60) + 12) % 24;
      }

      function formatTimeLeft(ms) {
        if (ms <= 0) return '已成熟';
        const totalSec = Math.ceil(ms / 1000);
        if (totalSec >= 60) {
          const min = Math.floor(totalSec / 60);
          const sec = totalSec % 60;
          return `${min}分${sec}秒`;
        }
        return `${totalSec}秒`;
      }

      function getCropStage(plot, state) {
        if (!plot.cropType || !plot.plantedAt) return null;
        const crop = CROPS[plot.cropType];
        const weatherInfo = WEATHER[state.weather];
        const elapsed = Date.now() - plot.plantedAt;
        const effectiveTime = crop.growthTime / weatherInfo.multiplier;
        const totalStages = crop.stages.length;
        const progress = Math.min(elapsed / effectiveTime, 1);
        const stageIndex = Math.min(Math.floor(progress * (totalStages - 1)), totalStages - 1);
        const timeLeft = Math.max(0, effectiveTime - elapsed);
        return { stageIndex, totalStages, progress, timeLeft, isMature: stageIndex >= totalStages - 1 };
      }

      // ============================================================
      // 状态管理
      // ============================================================
      function createInitialState() {
        const plots = Array.from({ length: MAX_PLOTS }, () => ({ cropType: null, plantedAt: null }));
        const storage = {};
        Object.values(CROPS).forEach(c => { storage[c.name] = { normal: 0, star: 0, diamond: 0 }; });
        const ranchPlots = Array.from({ length: RANCH_MAX_PLOTS }, () => ({ animalType: null, animals: [] }));
        const ranchStorage = {};
        Object.values(ANIMALS).forEach(a => {
          if (a.produceType) ranchStorage[a.produceName] = { normal: 0, star: 0, diamond: 0 };
          ranchStorage[a.slaughterName] = { normal: 0, star: 0, diamond: 0 };
          if (a.furType === 'wool') ranchStorage[a.produceName] = { normal: 0, star: 0, diamond: 0 };
        });
        return {
          plots,
          storage,
          ranchPlots,
          ranchStorage,
          coins: 50,
          weather: 'sunny',
          selectedCrop: null,
          selectedAnimal: null,
          breedMode: false,
          lastBreedAt: 0,
          gameEpoch: Date.now(),
          achievements: {},
          totalHarvested: 0,
          totalRanchHarvested: 0,
          lastLat: null,
          lastLon: null,
          weatherLocked: false,
          weatherCachedAt: null,
          weatherCacheData: null,
          unlockedPlots: INITIAL_UNLOCKED,
          unlockCost: BASE_UNLOCK_COST,
          ranchUnlockedPlots: RANCH_INITIAL_UNLOCKED,
          ranchUnlockCost: RANCH_BASE_UNLOCK_COST,
          unlockedCrops: { carrot: true },
          unlockedAnimals: { chicken: true }
        };
      }

      let state = createInitialState();
      let lightningTimer = null;
      let messageTimeout = null;

      // ============================================================
      // 存档系统
      // ============================================================
      function saveToLocalStorage() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn('保存失败:', e);
        }
      }

      function loadFromLocalStorage() {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (raw) {
            const saved = JSON.parse(raw);
            // 迁移旧存档 - 作物品质格式
            if (saved.storage && typeof saved.storage['胡萝卜'] === 'number') {
              const old = saved.storage;
              saved.storage = {};
              Object.values(CROPS).forEach(c => { saved.storage[c.name] = { normal: old[c.name] || 0, star: 0, diamond: 0 }; });
            }
            // 迁移旧存档 - 牧场动物改为独立个体
            if (saved.ranchPlots && saved.ranchPlots[0] && typeof saved.ranchPlots[0].count === 'number') {
              saved.ranchPlots = saved.ranchPlots.map(p => {
                if (p.animalType && p.count > 0) {
                  const animals = [];
                  for (let i = 0; i < p.count; i++) {
                    animals.push({
                      bredAt: (p.bredAt || Date.now()),
                      lastProduceAt: null
                    });
                  }
                  return { animalType: p.animalType, animals };
                }
                return { animalType: null, animals: [] };
              });
            }
            const initState = createInitialState();
            state = { ...initState, ...saved, plots: saved.plots || initState.plots, storage: saved.storage || initState.storage, ranchPlots: saved.ranchPlots || initState.ranchPlots, ranchStorage: saved.ranchStorage || initState.ranchStorage };
            return true;
          }
        } catch (e) {
          console.warn('读取存档失败:', e);
        }
        return false;
      }

      function exportSave() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'weather-farm-save.json';
        a.click();
        URL.revokeObjectURL(url);
        showMessage('✅ 存档已导出', 'success');
      }

      function importSave(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data.plots || !Array.isArray(data.plots)) throw new Error('无效的存档文件');
            const initState = createInitialState();
            state = { ...initState, ...data, plots: data.plots, storage: data.storage || initState.storage, ranchPlots: data.ranchPlots || initState.ranchPlots, ranchStorage: data.ranchStorage || initState.ranchStorage };
            saveToLocalStorage();
            fullRender();
            showMessage('✅ 存档已导入', 'success');
          } catch (e) {
            showMessage('❌ 导入失败：文件格式错误', 'error');
          }
        };
        reader.readAsText(file);
      }

      function resetGame() {
        if (!confirm('确定要重置游戏吗？所有数据将丢失！')) return;
        state = createInitialState();
        localStorage.removeItem(SAVE_KEY);
        fullRender();
        showMessage('🔄 已重置游戏', 'info');
      }

      // ============================================================
      // 消息系统
      // ============================================================
      function showMessage(text, type) {
        const el = $('#messageHint');
        if (!el) return;
        el.textContent = text;
        el.style.color = type === 'success' ? '#2ecc71' : type === 'error' ? '#e74c3c' : '#85c1e9';
        if (messageTimeout) clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => {
          const isFarm = $('#farmGrid').style.display !== 'none';
          el.textContent = isFarm ? '🌱 点击种子，再点空地种植' : '🐾 点击动物购入，右键屠宰';
          el.style.color = 'rgba(224,224,224,0.6)';
        }, 3000);
      }

      // ============================================================
      // 渲染函数
      // ============================================================
      function renderFarm() {
        const grid = $('#farmGrid');
        if (!grid) return;
        grid.innerHTML = state.plots.map((plot, index) => {
          if (index >= state.unlockedPlots) {
            const cost = state.unlockCost + (index - state.unlockedPlots) * Math.round(state.unlockCost * 0.5);
            return `<div class="plot locked" data-index="${index}" data-unlock-cost="${cost}">🔒<br><small>💰${cost}</small></div>`;
          }
          const stageInfo = getCropStage(plot, state);
          let content = '';
          if (plot.cropType && stageInfo) {
            const crop = CROPS[plot.cropType];
            const currentEmoji = crop.stages[stageInfo.stageIndex];
            const dots = crop.stages.map((_, i) => {
              let cls = 'stage-dot';
              if (i < stageInfo.stageIndex) cls += ' filled';
              else if (i === stageInfo.stageIndex) cls += ' current';
              return `<span class="${cls}"></span>`;
            }).join('');
            const label = stageInfo.isMature ?
              '<span class="ready-label">🍂 可收获</span>' :
              `<span class="grow-timer">${formatTimeLeft(stageInfo.timeLeft)}</span>`;
            content = `<span class="crop-emoji">${currentEmoji}</span><div class="stage-bar">${dots}</div>${label}`;
          } else {
            content = '<span class="plus-icon">➕</span>';
          }
          return `<div class="plot ${plot.cropType ? 'has-crop' : ''}" data-index="${index}">${content}</div>`;
        }).join('');

        grid.onclick = (e) => {
          const plotEl = e.target.closest('.plot');
          if (!plotEl) return;
          if (plotEl.classList.contains('locked')) {
            const cost = parseInt(plotEl.dataset.unlockCost);
            if (state.coins < cost) {
              showMessage(`💰 金币不足，需要 ${cost}💰`, 'error');
              return;
            }
            state.coins -= cost;
            state.unlockedPlots += 1;
            state.unlockCost = Math.round(state.unlockCost * UNLOCK_COST_MULTIPLIER);
            checkAchievements();
            saveToLocalStorage();
            fullRender();
            showMessage('🔓 解锁了新地块！', 'success');
            return;
          }
          handlePlotClick(parseInt(plotEl.dataset.index));
        };
      }

      function renderRanch() {
        const grid = $('#ranchGrid');
        if (!grid) return;
        const now = Date.now();
        grid.innerHTML = state.ranchPlots.map((plot, index) => {
          if (index >= state.ranchUnlockedPlots) {
            const cost = state.ranchUnlockCost + (index - state.ranchUnlockedPlots) * Math.round(state.ranchUnlockCost * 0.5);
            return `<div class="ranch-plot locked" data-ranch-index="${index}" data-unlock-cost="${cost}">🔒<br><small>💰${cost}</small></div>`;
          }
          if (plot.animalType && plot.animals && plot.animals.length > 0) {
            const animal = ANIMALS[plot.animalType];
            if (!animal) return `<div class="ranch-plot" data-ranch-index="${index}"><span class="ranch-plus-icon">❓</span></div>`;

            // Count growing vs ready-to-produce
            let growingCount = 0;
            let maxGrowTimeLeft = 0;
            let readyProduceCount = 0;
            let nextProduceTimeLeft = Infinity;

            plot.animals.forEach(a => {
              const isGrown = now - a.bredAt >= animal.breedTime;
              if (!isGrown) {
                growingCount++;
                const timeLeft = animal.breedTime - (now - a.bredAt);
                if (timeLeft > maxGrowTimeLeft) maxGrowTimeLeft = timeLeft;
              } else if (animal.produceType) {
                const elapsed = a.lastProduceAt ? now - a.lastProduceAt : Math.max(0, now - a.bredAt - animal.breedTime);
                if (elapsed >= animal.produceInterval) {
                  readyProduceCount++;
                } else {
                  const timeLeft = animal.produceInterval - elapsed;
                  if (timeLeft < nextProduceTimeLeft) nextProduceTimeLeft = timeLeft;
                }
              }
            });

            let growLabel = '';
            if (growingCount > 0) {
              growLabel = `<span class="grow-timer" style="font-size:0.6rem;">⏳ ${formatTimeLeft(maxGrowTimeLeft)}</span>`;
            }

            let produceLabel = '';
            if (readyProduceCount > 0) {
              produceLabel = `<span class="ranch-produce-ready">${animal.produceEmoji}×${readyProduceCount}</span>`;
            } else if (nextProduceTimeLeft < Infinity && animal.produceType) {
              produceLabel = `<span class="ranch-produce-ready">⏳ ${formatTimeLeft(nextProduceTimeLeft)}</span>`;
            }

            // Render emojis (max RANCH_MAX_PER_PLOT)
            const emojis = plot.animals.slice(0, RANCH_MAX_PER_PLOT).map((a, i) => {
              const isGrown = now - a.bredAt >= animal.breedTime;
              const path = (i % 4) + 1;
              const dur = (2 + Math.random() * 2).toFixed(1);
              const delay = (Math.random() * 2).toFixed(1);
              const emoji = isGrown ? animal.emoji : '🐤';
              return `<span class="ranch-animal-emoji" style="animation:wander${path} ${dur}s ease-in-out infinite;animation-delay:${delay}s">${emoji}</span>`;
            }).join('');

            const countLabel = plot.animals.length > RANCH_MAX_PER_PLOT
              ? `<span class="ranch-count-badge">+${plot.animals.length - RANCH_MAX_PER_PLOT}</span>` : '';

            return `<div class="ranch-plot has-crop" data-ranch-index="${index}">
              <div class="ranch-emoji-container">${emojis}</div>
              ${countLabel}
              ${growLabel}
              ${produceLabel}
            </div>`;
          } else {
            return `<div class="ranch-plot" data-ranch-index="${index}">
              <span class="ranch-plus-icon">➕</span>
            </div>`;
          }
        }).join('');

        grid.onclick = (e) => {
          const plotEl = e.target.closest('.ranch-plot');
          if (!plotEl) return;
          if (plotEl.classList.contains('locked')) {
            const cost = parseInt(plotEl.dataset.unlockCost);
            if (state.coins < cost) {
              showMessage(`💰 金币不足，需要 ${cost}💰`, 'error');
              return;
            }
            state.coins -= cost;
            state.ranchUnlockedPlots += 1;
            state.ranchUnlockCost = Math.round(state.ranchUnlockCost * RANCH_UNLOCK_COST_MULTIPLIER);
            checkAchievements();
            saveToLocalStorage();
            fullRender();
            showMessage('🔓 解锁了牧场新栏位！', 'success');
            return;
          }
          handleRanchPlotClick(parseInt(plotEl.dataset.ranchIndex));
        };

        grid.oncontextmenu = (e) => {
          e.preventDefault();
          const plotEl = e.target.closest('.ranch-plot');
          if (plotEl && !plotEl.classList.contains('locked')) {
            slaughterAnimal(parseInt(plotEl.dataset.ranchIndex));
          }
        };
      }

      function renderAnimalShop() {
        const container = $('#animalBar');
        if (!container) return;
        container.innerHTML = Object.entries(ANIMALS).map(([key, animal]) => {
          const unlocked = state.unlockedAnimals[key];
          if (!unlocked) {
            return `<button class="seed-btn unlock-btn" data-animal="${key}" data-unlock="true">
              <span class="seed-name">${animal.emoji} ${animal.name}</span>
              <span class="seed-cost">🔒 💰${animal.unlockCost}</span>
            </button>`;
          }
          const disabled = state.coins < animal.cost;
          const selected = state.selectedAnimal === key;
          return `<button class="seed-btn ${selected ? 'selected' : ''} ${disabled ? 'disabled' : ''}" 
            data-animal="${key}" ${disabled ? 'disabled' : ''}>
            <span class="seed-name">${animal.emoji} ${animal.name}</span>
            <span class="seed-cost">💰${animal.cost}</span>
          </button>`;
        }).join('');

        container.querySelectorAll('.seed-btn.unlock-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const animalKey = btn.dataset.animal;
            const animal = ANIMALS[animalKey];
            if (state.coins < animal.unlockCost) {
              showMessage('💰 金币不够解锁！', 'error');
              return;
            }
            state.coins -= animal.unlockCost;
            state.unlockedAnimals[animalKey] = true;
            saveToLocalStorage();
            fullRender();
            showMessage(`🔓 解锁了${animal.emoji}${animal.name}！`, 'success');
          });
        });

        container.querySelectorAll('.seed-btn:not(.disabled):not(.unlock-btn)').forEach(btn => {
          btn.addEventListener('click', () => {
            const animalKey = btn.dataset.animal;
            state.selectedAnimal = state.selectedAnimal === animalKey ? null : animalKey;
            renderAnimalShop();
          });
        });
      }

      function renderSeedBar() {
        const container = $('#seedBar');
        if (!container) return;
        container.innerHTML = Object.entries(CROPS).map(([key, crop]) => {
          const unlocked = state.unlockedCrops[key];
          if (!unlocked) {
            return `<button class="seed-btn unlock-btn" data-crop="${key}" data-unlock="true">
              <span class="seed-name">${crop.emoji} ${crop.name}</span>
              <span class="seed-cost">🔒 💰${crop.unlockCost}</span>
            </button>`;
          }
          const disabled = state.coins < crop.cost;
          const selected = state.selectedCrop === key;
          return `<button class="seed-btn ${selected ? 'selected' : ''} ${disabled ? 'disabled' : ''}" 
            data-crop="${key}" ${disabled ? 'disabled' : ''}>
            <span class="seed-name">${crop.emoji} ${crop.name}</span>
            <span class="seed-cost">💰${crop.cost}</span>
          </button>`;
        }).join('');

        container.querySelectorAll('.seed-btn.unlock-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const cropKey = btn.dataset.crop;
            const crop = CROPS[cropKey];
            if (state.coins < crop.unlockCost) {
              showMessage('💰 金币不够解锁！', 'error');
              return;
            }
            state.coins -= crop.unlockCost;
            state.unlockedCrops[cropKey] = true;
            saveToLocalStorage();
            fullRender();
            showMessage(`🔓 解锁了${crop.emoji}${crop.name}！`, 'success');
          });
        });

        container.querySelectorAll('.seed-btn:not(.disabled):not(.unlock-btn)').forEach(btn => {
          btn.addEventListener('click', () => {
            const cropKey = btn.dataset.crop;
            state.selectedCrop = state.selectedCrop === cropKey ? null : cropKey;
            renderSeedBar();
          });
        });
      }

      function renderStatusBar() {
        const coinsEl = $('#coinsDisplay');
        const dayEl = $('#dayDisplay');
        const timeEl = $('#timeDisplay');
        if (coinsEl) coinsEl.textContent = state.coins;
        if (dayEl) {
          const gameHour = getGameHour(state);
          const days = Math.floor(gameHour / 24) + 1;
          dayEl.textContent = `第${days}天`;
        }
        if (timeEl) {
          const gameHour = getGameHour(state);
          const h = Math.floor(gameHour % 24);
          const m = Math.floor((gameHour % 1) * 60);
          timeEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }
      }

      function renderAchievements() {
        const container = $('#achievementsArea');
        if (!container) return;
        container.innerHTML = ACHIEVEMENTS.map(a => {
          const unlocked = state.achievements[a.id];
          return `<span class="achievement-badge ${unlocked ? 'unlocked' : 'locked'}" 
            data-achievement-id="${a.id}"
            data-name="${a.name}"
            data-desc="${a.desc}"
            data-icon="${a.icon}">
            ${unlocked ? a.icon : '🔒'}
          </span>`;
        }).join('');
      }

      function renderStorage() {
        const container = $('#storageBody');
        if (!container) return;
        const hasAnyCrop = Object.values(state.storage).some(q => q.normal > 0 || q.star > 0 || q.diamond > 0);
        const hasAnyRanch = Object.values(state.ranchStorage).some(q => q.normal > 0 || q.star > 0 || q.diamond > 0);
        if (!hasAnyCrop && !hasAnyRanch) {
          container.innerHTML = '<div class="storage-empty"><div style="font-size:48px;margin-bottom:12px;">📦</div><div>仓库空空如也~</div><div style="font-size:12px;color:#888;margin-top:8px;">快去种植收获吧！</div></div>';
          return;
        }
        let html = '<div class="storage-grid">';
        // 作物
        if (hasAnyCrop) {
          html += '<div style="grid-column:1/-1;font-size:13px;color:#85c1e9;margin-top:4px;">🌾 农作物</div>';
          html += Object.entries(state.storage)
            .filter(([, qual]) => qual.normal > 0 || qual.star > 0 || qual.diamond > 0)
            .map(([name, qual]) => {
              const crop = Object.values(CROPS).find(c => c.name === name);
              const cropKey = Object.keys(CROPS).find(k => CROPS[k].name === name) || '';
              const emoji = crop ? crop.emoji : '❓';
              const total = qual.normal + qual.star + qual.diamond;
              let qualityItems = [];
              if (qual.normal > 0) qualityItems.push(makeQualityItem(cropKey, 'normal', qual.normal, crop.value));
              if (qual.star > 0) qualityItems.push(makeQualityItem(cropKey, 'star', qual.star, crop.value, 'star'));
              if (qual.diamond > 0) qualityItems.push(makeQualityItem(cropKey, 'diamond', qual.diamond, crop.value, 'diamond'));
              return `<div class="storage-crop-card">
                <div class="crop-card-header">
                  <span class="crop-emoji">${emoji}</span>
                  <span class="crop-name">${name}</span>
                  <button class="sell-all-btn" data-crop="${cropKey}">💰 一键出售</button>
                  <span class="crop-total">共 ${total} 个</span>
                </div>
                <div class="crop-card-actions">${qualityItems.join('')}</div>
              </div>`;
            }).join('');
        }
        // 动物产物
        if (hasAnyRanch) {
          html += '<div style="grid-column:1/-1;font-size:13px;color:#f0b27a;margin-top:4px;">🐄 动物产物</div>';
          html += Object.entries(state.ranchStorage)
            .filter(([, qual]) => qual.normal > 0 || qual.star > 0 || qual.diamond > 0)
            .map(([name, qual]) => {
              const animal = Object.values(ANIMALS).find(a => a.produceName === name || a.slaughterName === name);
              const emoji = animal ? (animal.produceName === name ? animal.produceEmoji : animal.slaughterEmoji) : '❓';
              const total = qual.normal + qual.star + qual.diamond;
              const baseValue = animal ? (animal.produceName === name ? animal.produceValue : animal.slaughterValue) : 10;
              let qualityItems = [];
              if (qual.normal > 0) qualityItems.push(makeAnimalQualityItem(name, 'normal', qual.normal, baseValue));
              if (qual.star > 0) qualityItems.push(makeAnimalQualityItem(name, 'star', qual.star, baseValue, 'star'));
              if (qual.diamond > 0) qualityItems.push(makeAnimalQualityItem(name, 'diamond', qual.diamond, baseValue, 'diamond'));
              return `<div class="storage-crop-card">
                <div class="crop-card-header">
                  <span class="crop-emoji">${emoji}</span>
                  <span class="crop-name">${name}</span>
                  <button class="sell-all-btn" data-ranch="${name}">💰 一键出售</button>
                  <span class="crop-total">共 ${total} 个</span>
                </div>
                <div class="crop-card-actions">${qualityItems.join('')}</div>
              </div>`;
            }).join('');
        }
        html += '</div>';
        container.innerHTML = html;
      }

      function makeQualityItem(cropKey, quality, count, baseValue, extraClass = '') {
        const mult = QUALITY_MAP[quality].multiplier;
        const price = Math.round(baseValue * mult);
        const prefix = quality === 'star' ? '⭐' : quality === 'diamond' ? '💎' : '';
        return `<div class="storage-quality-item ${extraClass}" data-crop="${cropKey}" data-quality="${quality}">
          <span class="quality-count">${prefix}×${count}</span>
          <span class="quality-price">💰${price}</span>
          <span class="quality-action">出售</span>
        </div>`;
      }

      function makeAnimalQualityItem(productName, quality, count, baseValue, extraClass = '') {
        const mult = QUALITY_MAP[quality].multiplier;
        const price = Math.round(baseValue * mult);
        const prefix = quality === 'star' ? '⭐' : quality === 'diamond' ? '💎' : '';
        return `<div class="storage-quality-item ${extraClass}" data-ranch="${productName}" data-quality="${quality}">
          <span class="quality-count">${prefix}×${count}</span>
          <span class="quality-price">💰${price}</span>
          <span class="quality-action">出售</span>
        </div>`;
      }

      function sellAnimalProduct(productName, quality) {
        const qual = state.ranchStorage[productName];
        if (!qual || qual[quality] <= 0) return;
        const animal = Object.values(ANIMALS).find(a => a.produceName === productName || a.slaughterName === productName);
        const baseValue = animal ? (animal.produceName === productName ? animal.produceValue : animal.slaughterValue) : 10;
        const price = Math.round(baseValue * QUALITY_MAP[quality].multiplier);
        qual[quality] -= 1;
        state.coins += price;
        saveToLocalStorage();
        fullRender();
        renderStorage();
        showMessage(`💰 出售了 ${productName}，获得 ${price}💰`, 'success');
      }

      function sellAllAnimalProduct(productName) {
        const qual = state.ranchStorage[productName];
        if (!qual) return;
        const total = qual.normal + qual.star + qual.diamond;
        if (total <= 0) return;
        const animal = Object.values(ANIMALS).find(a => a.produceName === productName || a.slaughterName === productName);
        const baseValue = animal ? (animal.produceName === productName ? animal.produceValue : animal.slaughterValue) : 10;
        let totalPrice = qual.normal * baseValue + qual.star * baseValue * 2 + qual.diamond * baseValue * 5;
        qual.normal = qual.star = qual.diamond = 0;
        state.coins += totalPrice;
        saveToLocalStorage();
        fullRender();
        renderStorage();
        showMessage(`💰 全部出售了 ${total} 个${productName}，获得 ${totalPrice}💰`, 'success');
      }

      function renderHandBook() {
        const container = $('#handbookBody');
        if (!container) return;
        const cropEntries = Object.entries(CROPS).map(([key, crop]) => {
          const qual = state.storage[crop.name];
          const totalHarvested = qual ? qual.normal + qual.star + qual.diamond : 0;
          const unlocked = totalHarvested > 0;
          const stageLabels = ['种子', '发芽', '生长', '成熟'];
          return `<div class="handbook-entry ${unlocked ? 'unlocked' : 'locked'}">
            <div class="entry-header">
              <span>${crop.emoji}</span>
              <span class="entry-name">${crop.name}</span>
              <span class="entry-status">${unlocked ? '✓ 已解锁' : '🔒 未解锁'}</span>
            </div>
            <div class="handbook-stages">
              ${crop.stages.map((emoji, i) => `
                <div class="handbook-stage"><span class="stage-emoji">${emoji}</span><span class="stage-label">${stageLabels[i]}</span></div>
              `).join('')}
            </div>
            ${unlocked ? `<div class="entry-harvest">📊 已收获 ${totalHarvested} 个（⭐${qual.star} 💎${qual.diamond}）</div>` : ''}
          </div>`;
        }).join('');

        const animalEntries = Object.entries(ANIMALS).map(([key, animal]) => {
          const owned = state.ranchPlots.filter(p => p.animalType === key).reduce((sum, p) => sum + (p.animals?.length || 0), 0);
          const unlocked = owned > 0 || Object.keys(state.ranchStorage).some(n => {
            const a = Object.values(ANIMALS).find(v => v.produceName === n || v.slaughterName === n);
            return a && a.name === animal.name && (state.ranchStorage[n].normal + state.ranchStorage[n].star + state.ranchStorage[n].diamond) > 0;
          });
          let parts = [];
          if (animal.produceType) parts.push(`可产出${animal.produceEmoji}${animal.produceName}`);
          parts.push(`屠宰得${animal.slaughterEmoji}${animal.slaughterName}`);
          if (animal.furType === 'wool') parts.push(`+🧶羊毛`);
          return `<div class="handbook-entry ${unlocked ? 'unlocked' : 'locked'}">
            <div class="entry-header">
              <span>${animal.emoji}</span>
              <span class="entry-name">${animal.name}</span>
              <span class="entry-status">${unlocked ? '✓ 已解锁' : '🔒 未解锁'}</span>
            </div>
            <div class="handbook-stages">
              <div class="handbook-stage"><span class="stage-emoji">${animal.emoji}</span><span class="stage-label">幼崽</span></div>
              <div class="handbook-stage"><span class="stage-emoji">⏳</span><span class="stage-label">${Math.round(animal.breedTime/60000)}分</span></div>
              <div class="handbook-stage"><span class="stage-emoji">${animal.emoji}</span><span class="stage-label">成年</span></div>
            </div>
            ${unlocked ? `<div class="entry-harvest">🐾 已拥有 ${owned} 只 — ${parts.join('，')}</div>` : ''}
          </div>`;
        }).join('');

        container.innerHTML = cropEntries + animalEntries;
      }

      function fullRender() {
        renderFarm();
        renderSeedBar();
        renderAnimalShop();
        renderRanch();
        renderStatusBar();
        renderAchievements();
      }

      // ============================================================
      // 核心交互
      // ============================================================
      function handlePlotClick(index) {
        if (index >= state.unlockedPlots) return;
        const plot = state.plots[index];
        const stageInfo = plot.cropType ? getCropStage(plot, state) : null;

        if (state.selectedCrop && !plot.cropType) {
          const crop = CROPS[state.selectedCrop];
          if (state.coins < crop.cost) {
            showMessage('💰 金币不够啦！', 'error');
            return;
          }
          state.coins -= crop.cost;
          plot.cropType = state.selectedCrop;
          plot.plantedAt = Date.now();
          saveToLocalStorage();
          fullRender();
          showMessage(`🌱 种下了${crop.emoji}${crop.name}！`, 'success');
          return;
        }

        if (plot.cropType && stageInfo?.isMature) {
          const crop = CROPS[plot.cropType];
          const dropCount = crop.dropMin + Math.floor(Math.random() * (crop.dropMax - crop.dropMin + 1));
          let starCount = 0, diamondCount = 0;
          for (let i = 0; i < dropCount; i++) {
            const quality = rollQuality();
            state.storage[crop.name][quality] += 1;
            state.totalHarvested += 1;
            if (quality === 'star') starCount++;
            if (quality === 'diamond') diamondCount++;
          }
          checkAchievements();
          let msg = `🎉 收获了 ${crop.emoji}${crop.name} ×${dropCount}`;
          if (starCount) msg += ` ⭐${starCount}`;
          if (diamondCount) msg += ` 💎${diamondCount}`;
          showMessage(msg + '！已入库', 'success');
          plot.cropType = null;
          plot.plantedAt = null;
          saveToLocalStorage();
          fullRender();
          return;
        }

        if (plot.cropType && stageInfo && !stageInfo.isMature) {
          showMessage(`⏳ 再等等~ ${formatTimeLeft(stageInfo.timeLeft)} 后成熟`, 'info');
          return;
        }

        showMessage('🌱 先点击种子选择要种的作物', 'info');
      }

      function sellCrop(cropKey, quality) {
        const crop = CROPS[cropKey];
        if (!crop) return;
        const qual = state.storage[crop.name];
        if (!qual || qual[quality] <= 0) return;
        const price = Math.round(crop.value * QUALITY_MAP[quality].multiplier);
        qual[quality] -= 1;
        state.coins += price;
        saveToLocalStorage();
        fullRender();
        renderStorage();
        showMessage(`💰 出售了 ${crop.emoji}${crop.name}，获得 ${price}💰`, 'success');
      }

      function sellAllCrop(cropKey) {
        const crop = CROPS[cropKey];
        if (!crop) return;
        const qual = state.storage[crop.name];
        const total = qual.normal + qual.star + qual.diamond;
        if (total <= 0) return;
        let totalPrice = qual.normal * crop.value + qual.star * crop.value * 2 + qual.diamond * crop.value * 5;
        qual.normal = qual.star = qual.diamond = 0;
        state.coins += totalPrice;
        saveToLocalStorage();
        fullRender();
        renderStorage();
        showMessage(`💰 全部出售了 ${total} 个${crop.emoji}${crop.name}，获得 ${totalPrice}💰`, 'success');
      }

      // ============================================================
      // 牧场交互
      // ============================================================
      function handleRanchPlotClick(index) {
        if (index >= state.ranchUnlockedPlots) return;
        const plot = state.ranchPlots[index];
        const now = Date.now();

        // Breed mode: if player clicked a plot, try to breed
        if (state.breedMode) {
          state.breedMode = false;
          $('#breedBtn').textContent = '🐣 繁殖动物';
          if (plot.animalType) {
            breedAnimal(index);
          } else {
            showMessage('🐾 选择一个有动物的栏位', 'info');
          }
          return;
        }

        // If selected animal matches existing animal in plot, add one more
        if (state.selectedAnimal && plot.animalType === state.selectedAnimal) {
          const animal = ANIMALS[state.selectedAnimal];
          if (plot.animals.length >= RANCH_MAX_PER_PLOT) {
            showMessage(`🐾 该栏位已满（最多${RANCH_MAX_PER_PLOT}只）`, 'info');
            return;
          }
          if (state.coins < animal.cost) {
            showMessage('💰 金币不够啦！', 'error');
            return;
          }
          state.coins -= animal.cost;
          plot.animals.push({ bredAt: now, lastProduceAt: null });
          saveToLocalStorage();
          fullRender();
          renderAnimalShop();
          showMessage(`🐾 又购入1只${animal.emoji}${animal.name}！（共${plot.animals.length}只）`, 'success');
          return;
        }

        // If an animal is selected and plot is empty, buy and place
        if (state.selectedAnimal && !plot.animalType) {
          const animal = ANIMALS[state.selectedAnimal];
          if (state.coins < animal.cost) {
            showMessage('💰 金币不够啦！', 'error');
            return;
          }
          state.coins -= animal.cost;
          plot.animalType = state.selectedAnimal;
          plot.animals = [{ bredAt: now, lastProduceAt: null }];
          saveToLocalStorage();
          fullRender();
          renderAnimalShop();
          showMessage(`🐾 购买了${animal.emoji}${animal.name}！`, 'success');
          return;
        }

        // If animal exists, check for produce collection
        if (plot.animalType) {
          const animal = ANIMALS[plot.animalType];
          // Collect from ALL adult animals with produce ready
          let collectedCount = 0;
          let produceName = '';
          for (const a of plot.animals) {
            if (now - a.bredAt >= animal.breedTime) {
              const elapsed = a.lastProduceAt ? now - a.lastProduceAt : Math.max(0, now - a.bredAt - animal.breedTime);
              if (animal.produceType && elapsed >= animal.produceInterval) {
                collectAnimalProduce(index, a);
                collectedCount++;
                produceName = `${animal.produceEmoji}${animal.produceName}`;
              }
            }
          }
          if (collectedCount > 0) {
            showMessage(`🥛 收获了 ${collectedCount} 个${produceName}！已入库`, 'success');
            saveToLocalStorage();
            fullRender();
            return;
          }
          // Check if any are still growing
          const growing = plot.animals.find(a => now - a.bredAt < animal.breedTime);
          if (growing) {
            const timeLeft = animal.breedTime - (now - growing.bredAt);
            showMessage(`⏳ 幼崽成长中~ ${formatTimeLeft(timeLeft)}`, 'info');
            return;
          }
          // All grown, no produce ready
          const hint = animal.produceType ? '左键收产物 / 右键屠宰' : '右键屠宰';
          showMessage(`🐾 ${animal.emoji}${animal.name} - ${hint}`, 'info');
          return;
        }

        showMessage('🐾 先选择动物再放入牧场', 'info');
      }

      function collectAnimalProduce(plotIndex, animalData) {
        const plot = state.ranchPlots[plotIndex];
        const animal = ANIMALS[plot.animalType];
        const quality = rollQuality();
        state.ranchStorage[animal.produceName][quality] += 1;
        state.totalRanchHarvested += 1;
        animalData.lastProduceAt = Date.now();
        checkAchievements();
      }

      function slaughterAnimal(plotIndex) {
        const plot = state.ranchPlots[plotIndex];
        if (!plot.animalType || plot.animals.length === 0) return;
        const animal = ANIMALS[plot.animalType];
        const now = Date.now();

        // Find oldest adult animal to slaughter
        const adultIdx = plot.animals.findIndex(a => now - a.bredAt >= animal.breedTime);
        if (adultIdx === -1) {
          showMessage('⏳ 没有成年动物可以宰杀', 'info');
          return;
        }

        const quality = rollQuality();
        const qInfo = QUALITY_MAP[quality];
        state.ranchStorage[animal.slaughterName][quality] += 1;
        state.totalRanchHarvested += 1;
        // Also give fur if applicable
        if (animal.furType === 'wool') {
          const furQuality = rollQuality();
          state.ranchStorage[animal.produceName][furQuality] += 1;
          state.totalRanchHarvested += 1;
        }
        checkAchievements();
        const qualityTag = qInfo.emoji ? ` ${qInfo.emoji}${qInfo.label}` : '';
        let msg = `🔪 宰杀了1只${animal.emoji}${animal.name}，获得 ${animal.slaughterEmoji}${animal.slaughterName}${qualityTag}`;
        if (animal.furType === 'wool') msg += ` + 🧶羊毛`;

        plot.animals.splice(adultIdx, 1);
        if (plot.animals.length === 0) {
          plot.animalType = null;
        }
        showMessage(msg + `（剩余${plot.animals.length}只）`, 'success');
        saveToLocalStorage();
        fullRender();
      }

      function breedAnimal(plotIndex) {
        const plot = state.ranchPlots[plotIndex];
        if (!plot.animalType) return;
        const animal = ANIMALS[plot.animalType];
        const now = Date.now();

        // Check cooldown
        if (now - state.lastBreedAt < BREED_COOLDOWN) {
          showMessage(`⏳ 繁殖冷却中，剩余 ${formatTimeLeft(BREED_COOLDOWN - (now - state.lastBreedAt))}`, 'info');
          return;
        }

        // Check at least 2 adult animals
        const adultCount = plot.animals.filter(a => now - a.bredAt >= animal.breedTime).length;
        if (adultCount < 2) {
          showMessage(`🐾 栏位中至少需要2只成年${animal.name}才能繁殖`, 'info');
          return;
        }
        // Check max limit
        if (plot.animals.length >= RANCH_MAX_PER_PLOT) {
          showMessage(`🐾 该栏位已满（最多${RANCH_MAX_PER_PLOT}只）`, 'info');
          return;
        }
        // Deduct cost (50% of animal purchase price)
        const cost = Math.round(animal.cost * 0.5);
        if (state.coins < cost) {
          showMessage(`💰 金币不足，繁殖需要 ${cost}💰`, 'error');
          return;
        }
        state.coins -= cost;
        // Add new baby and set cooldown
        plot.animals.push({ bredAt: now, lastProduceAt: null });
        state.lastBreedAt = now;
        showMessage(`🐣 ${animal.emoji}${animal.name} 繁殖成功！花费 ${cost}💰，幼崽需 ${Math.round(animal.breedTime / 60000)} 分钟成长`, 'success');
        saveToLocalStorage();
        fullRender();
      }

      function checkAchievements() {
        ACHIEVEMENTS.forEach(a => {
          if (!state.achievements[a.id] && a.check(state)) {
            state.achievements[a.id] = true;
            setTimeout(() => showMessage(`🏆 成就解锁：${a.icon} ${a.name} — ${a.desc}`, 'success'), 100);
          }
        });
        renderAchievements();
      }

      // ============================================================
      // 天气系统
      // ============================================================
      function setWeather(weatherKey) {
        if (!WEATHER[weatherKey]) return;
        state.weather = weatherKey;
        updateWeatherCanvas();
        renderStatusBar();
        renderFarm();
        saveToLocalStorage();
        $$('.header-weather-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.weather === weatherKey));
      }

      function updateWeatherCanvas() {
        const canvas = $('#weatherCanvas');
        const sun = $('#sun');
        const moon = $('#moon');
        if (!canvas) return;
        const w = WEATHER[state.weather];
        canvas.style.background = w.sky;
        if (sun) sun.classList.toggle('hidden', w.particle === 'rain');
        if (moon) {
          const isNight = getGameHour(state) >= 20 || getGameHour(state) <= 5;
          moon.classList.toggle('visible', isNight);
        }
        updateParticles(w);
        updateLightning();
      }

      function updateParticles(weather) {
        const container = $('#particlesContainer');
        if (!container) return;
        container.innerHTML = '';
        if (weather.particle === 'none') return;
        const count = weather.particleCount || 0;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = weather.particle === 'rain' ? 'raindrop' : 'snowflake';
          el.style.left = Math.random() * 100 + '%';
          const dur = weather.particle === 'rain' ? 0.5 + Math.random() * 0.5 : 2 + Math.random() * 3;
          el.style.animationDuration = dur + 's';
          el.style.animationDelay = Math.random() * dur + 's';
          if (weather.particle === 'snow') {
            el.style.width = el.style.height = (3 + Math.random() * 4) + 'px';
          }
          frag.appendChild(el);
        }
        container.appendChild(frag);
      }

      function updateLightning() {
        if (lightningTimer) { clearTimeout(lightningTimer); lightningTimer = null; }
        const flash = $('#lightningFlash');
        if (!flash) return;
        flash.classList.remove('active');
        if (state.weather === 'stormy') scheduleLightning();
      }

      function scheduleLightning() {
        if (state.weather !== 'stormy') return;
        lightningTimer = setTimeout(triggerLightning, 2000 + Math.random() * 5000);
      }

      function triggerLightning() {
        const flash = $('#lightningFlash');
        if (!flash) return;
        flash.classList.add('active');
        const duration = 100 + Math.random() * 150;
        setTimeout(() => {
          flash.classList.remove('active');
          if (Math.random() > 0.7) {
            setTimeout(() => { flash.classList.add('active'); setTimeout(() => flash.classList.remove('active'), 60 + Math.random() * 80); }, 50 + Math.random() * 100);
          }
          scheduleLightning();
        }, duration);
      }

      function updateDayNight() {
        const moon = $('#moon');
        const sun = $('#sun');
        if (!moon || !sun) return;
        const isNight = getGameHour(state) >= 20 || getGameHour(state) <= 5;
        moon.classList.toggle('visible', isNight);
        if (isNight) sun.classList.add('hidden');
        else if (WEATHER[state.weather].particle !== 'rain') sun.classList.remove('hidden');
      }

      // ============================================================
      // 城市建筑
      // ============================================================
      function initCity() {
        const container = $('#cityBuildings');
        if (!container) return;
        container.innerHTML = BUILDINGS.map((b) => {
          const cols = Math.floor(b.width / 14);
          const rows = Math.floor(b.height / 16);
          let windowsHTML = '';
          for (let r = 0; r < rows; r++)
            for (let c = 0; c < cols; c++)
              windowsHTML += `<div class="window ${Math.random() > 0.4 ? '' : 'off'}" style="left:${6 + c * 14}px;bottom:${b.height - 10 - r * 16}px;"></div>`;
          return `<div class="building" style="left:${b.left}px;width:${b.width}px;height:${b.height}px;background:${b.color};"><div class="roof"></div>${windowsHTML}</div>`;
        }).join('');
      }

      function randomizeWindows() {
        $$('.window').forEach(w => { if (Math.random() > 0.85) w.classList.toggle('off'); });
      }

      // ============================================================
      // 弹窗控制
      // ============================================================
      function openModal(id) { $('#' + id).classList.add('open'); }
      function closeModal(id) { $('#' + id).classList.remove('open'); }
      function openStorage() { renderStorage(); openModal('storageModal'); }
      function openHandBook() { renderHandBook(); openModal('handbookModal'); }

      // ============================================================
      // 定位与真实天气
      // ============================================================
      async function fetchWeatherByCoords(latitude, longitude) {
        if (state.weatherCachedAt && state.weatherCacheData && Date.now() - state.weatherCachedAt < WEATHER_CACHE_TTL) {
          const cache = state.weatherCacheData;
          setWeather(cache.weather);
          $('#locationStatus').textContent = `${cache.city} ${cache.temp}°C`;
          return;
        }
        try {
          const [cityName, weatherData] = await Promise.all([
            (async () => {
              try {
                const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=zh`);
                if (!r.ok) return '';
                const d = await r.json();
                return d.locality || d.city || d.principalSubdivision || '';
              } catch (_) { return ''; }
            })(),
            (async () => {
              const r = await fetch(`https://wttr.in/${latitude},${longitude}?format=j1&lang=zh`);
              if (!r.ok) throw new Error('天气 API 请求失败');
              return r.json();
            })()
          ]);
          const areaNames = weatherData.nearest_area?.[0]?.areaName || [];
          const fallbackCity = areaNames.find(n => n.lang === 'zh')?.value || areaNames[0]?.value || '';
          const displayCity = cityName || fallbackCity;
          const cur = weatherData.current_condition?.[0];
          if (!cur) throw new Error('无法解析天气数据');
          const desc = (cur.weatherDesc?.[0]?.value || '').toLowerCase();
          let gameWeather = 'sunny';
          if (desc.includes('thunder') || desc.includes('storm')) gameWeather = 'stormy';
          else if (desc.includes('rain') || desc.includes('drizzle') || desc.includes('shower')) gameWeather = 'rainy';
          else if (desc.includes('snow') || desc.includes('sleet') || desc.includes('blizzard') || desc.includes('ice')) gameWeather = 'snowy';
          setWeather(gameWeather);
          state.weatherLocked = true;
          state.weatherCachedAt = Date.now();
          state.weatherCacheData = { weather: gameWeather, temp: Math.round(cur.temp_C), city: displayCity };
          saveToLocalStorage();
          $('#locationStatus').textContent = `${displayCity} ${cur.temp_C}°C`;
          showMessage(`📍 ${displayCity}天气已同步`, 'success');
        } catch (err) {
          console.warn('天气获取失败:', err);
          $('#locationStatus').textContent = '';
          showMessage('📍 定位失败，请重试', 'error');
        }
      }

      async function fetchWeatherByGPS() {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
          });
          state.lastLat = pos.coords.latitude;
          state.lastLon = pos.coords.longitude;
          saveToLocalStorage();
          await fetchWeatherByCoords(state.lastLat, state.lastLon);
        } catch (err) {
          console.warn('定位失败:', err.message);
        }
      }

      function showWeatherTooltip(anchor, weatherKey) {
        const w = WEATHER[weatherKey];
        const tip = $('#weatherTooltip');
        if (!tip) return;
        tip.innerHTML = `<div class="tooltip-icon">${w.icon}</div><div class="tooltip-name">${w.label}</div><div class="tooltip-detail">🌱 生长 ×${w.multiplier}</div>`;
        const rect = anchor.getBoundingClientRect();
        tip.style.left = rect.left + 'px';
        tip.style.top = (rect.bottom + 8) + 'px';
        tip.classList.add('visible');
      }

      function hideWeatherTooltip() { $('#weatherTooltip')?.classList.remove('visible'); }

      // ============================================================
      // 事件绑定
      // ============================================================
      function bindEvents() {
        $$('.header-weather-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (!state.weatherLocked) setWeather(btn.dataset.weather);
          });
          btn.addEventListener('mouseenter', () => {
            if (state.weatherLocked && btn.dataset.weather !== state.weather) showWeatherTooltip(btn, btn.dataset.weather);
          });
          btn.addEventListener('mouseleave', hideWeatherTooltip);
        });

        $('#gpsBtn')?.addEventListener('click', () => {
          showMessage('📍 正在获取定位...', 'info');
          fetchWeatherByGPS();
        });

        $('#saveBtn')?.addEventListener('click', () => { saveToLocalStorage(); showMessage('💾 已保存到本地', 'success'); });
        $('#exportBtn')?.addEventListener('click', exportSave);
        $('#importBtn')?.addEventListener('click', () => $('#import-input').click());
        $('#import-input')?.addEventListener('change', (e) => {
          if (e.target.files.length > 0) { importSave(e.target.files[0]); e.target.value = ''; }
        });
        $('#resetBtn')?.addEventListener('click', resetGame);

        $$('.farm-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            $$('.farm-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const isFarm = btn.dataset.mode === 'farm';
            $('#farmGrid').style.display = isFarm ? '' : 'none';
            $('#ranchGrid').style.display = isFarm ? 'none' : '';
            $('#seedShopSection').style.display = isFarm ? '' : 'none';
            $('#animalShopSection').style.display = isFarm ? 'none' : '';

            if (isFarm) {
              $('#messageHint').textContent = '🌱 点击种子，再点空地种植';
              state.selectedAnimal = null;
              renderAnimalShop();
              // Cancel breed mode if active
              if (state.breedMode) {
                state.breedMode = false;
                $('#breedBtn').textContent = '🐣 繁殖动物';
              }
            } else {
              $('#messageHint').textContent = '🐾 点击动物购入，右键屠宰';
              state.selectedCrop = null;
              renderSeedBar();
              renderRanch();
              renderAnimalShop();
            }
          });
        });

        $('#handbookBtn')?.addEventListener('click', openHandBook);
        $('#handbookClose')?.addEventListener('click', () => closeModal('handbookModal'));
        $('#handbookModal')?.addEventListener('click', (e) => { if (e.target.id === 'handbookModal') closeModal('handbookModal'); });
        $('#storageBtn')?.addEventListener('click', openStorage);
        $('#storageClose')?.addEventListener('click', () => closeModal('storageModal'));
        $('#storageModal')?.addEventListener('click', (e) => { if (e.target.id === 'storageModal') closeModal('storageModal'); });

        $('#storageBody')?.addEventListener('click', (e) => {
          const qualityItem = e.target.closest('.storage-quality-item');
          if (qualityItem) {
            if (qualityItem.dataset.crop) {
              sellCrop(qualityItem.dataset.crop, qualityItem.dataset.quality);
            } else if (qualityItem.dataset.ranch) {
              sellAnimalProduct(qualityItem.dataset.ranch, qualityItem.dataset.quality);
            }
            return;
          }
          const sellAllBtn = e.target.closest('.sell-all-btn');
          if (sellAllBtn) {
            if (sellAllBtn.dataset.crop) {
              sellAllCrop(sellAllBtn.dataset.crop);
            } else if (sellAllBtn.dataset.ranch) {
              sellAllAnimalProduct(sellAllBtn.dataset.ranch);
            }
          }
        });


        $('#breedBtn')?.addEventListener('click', () => {
          const now = Date.now();
          if (now - state.lastBreedAt < BREED_COOLDOWN) {
            showMessage(`⏳ 繁殖冷却中，剩余 ${formatTimeLeft(BREED_COOLDOWN - (now - state.lastBreedAt))}`, 'info');
            return;
          }
          const hasEligible = state.ranchPlots.some(p => {
            if (!p.animalType || p.animals.length < 2) return false;
            const animal = ANIMALS[p.animalType];
            const adultCount = p.animals.filter(a => now - a.bredAt >= animal.breedTime).length;
            return adultCount >= 2 && p.animals.length < RANCH_MAX_PER_PLOT;
          });
          if (!hasEligible) {
            showMessage('🐾 没有可繁殖的动物（需要≥2只成年同种 + 有空位）', 'info');
            return;
          }
          state.breedMode = !state.breedMode;
          if (state.breedMode) {
            $('#breedBtn').textContent = '🔴 取消繁殖';
            showMessage('🐣 点击一个要繁殖的栏位', 'info');
          } else {
            $('#breedBtn').textContent = '🐣 繁殖动物';
            showMessage('已取消繁殖', 'info');
          }
        });

        // Achievement tooltip hover
        const achContainer = $('#achievementsArea');
        const achTip = $('#achievementTooltip');
        if (achContainer && achTip) {
          achContainer.addEventListener('mouseenter', (e) => {
            const badge = e.target.closest('.achievement-badge');
            if (!badge) { achTip.classList.remove('visible'); return; }
            const icon = badge.dataset.icon || '🏅';
            const name = badge.dataset.name || '';
            const desc = badge.dataset.desc || '';
            achTip.innerHTML = `<div class="tooltip-title">${icon} ${name}</div><div class="tooltip-desc">${desc}</div>`;
            const rect = badge.getBoundingClientRect();
            achTip.style.left = rect.left + 'px';
            achTip.style.top = (rect.bottom + 8) + 'px';
            achTip.classList.add('visible');
          }, true);
          achContainer.addEventListener('mouseleave', () => {
            achTip.classList.remove('visible');
          }, true);
          // Track mouse within badges for position updates
          achContainer.addEventListener('mousemove', (e) => {
            const badge = e.target.closest('.achievement-badge');
            if (!badge) { achTip.classList.remove('visible'); return; }
            const rect = badge.getBoundingClientRect();
            achTip.style.left = rect.left + 'px';
            achTip.style.top = (rect.bottom + 8) + 'px';
          });
        }

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { closeModal('handbookModal'); closeModal('storageModal'); }
          if (e.key === 's' && e.ctrlKey) { e.preventDefault(); saveToLocalStorage(); showMessage('💾 已保存到本地', 'success'); }
        });
      }

      // ============================================================
      // Tick 循环 — 仅更新计时，不重建 DOM
      // ============================================================
      function tick() {
        try {
          renderFarm();
          updateRanchTimers();
          renderStatusBar();
          updateDayNight();
          randomizeWindows();
        } catch (e) {
          console.warn('tick error:', e);
        }
      }

      function updateRanchTimers() {
        const now = Date.now();
        $$('.ranch-plot.has-crop').forEach(plotEl => {
          const index = parseInt(plotEl.dataset.ranchIndex);
          const plot = state.ranchPlots[index];
          if (!plot || !plot.animalType || !plot.animals) return;
          const animal = ANIMALS[plot.animalType];
          if (!animal) return;

          // Find grow timer label
          const growEl = plotEl.querySelector('.grow-timer');
          if (growEl) {
            const growing = plot.animals.find(a => now - a.bredAt < animal.breedTime);
            if (growing) {
              const timeLeft = animal.breedTime - (now - growing.bredAt);
              growEl.textContent = `⏳ ${formatTimeLeft(timeLeft)}`;
            } else {
              growEl.remove();
            }
          }

          // Find produce timer label
          const produceEl = plotEl.querySelector('.ranch-produce-ready');
          if (!animal.produceType) {
            if (produceEl) produceEl.remove();
            return;
          }

          let readyCount = 0;
          let minTimeLeft = Infinity;
          plot.animals.forEach(a => {
            if (now - a.bredAt >= animal.breedTime) {
              const elapsed = a.lastProduceAt ? now - a.lastProduceAt : Math.max(0, now - a.bredAt - animal.breedTime);
              const timeLeft = animal.produceInterval - elapsed;
              if (timeLeft <= 0) readyCount++;
              else if (timeLeft < minTimeLeft) minTimeLeft = timeLeft;
            }
          });

          if (produceEl) {
            if (readyCount > 0) {
              produceEl.textContent = `${animal.produceEmoji}`;
            } else if (minTimeLeft < Infinity) {
              produceEl.textContent = `⏳ ${formatTimeLeft(minTimeLeft)}`;
            } else {
              produceEl.remove();
            }
          } else if (readyCount > 0 || minTimeLeft < Infinity) {
            // Need to create the label — full render to add it
            renderRanch();
            return;
          }
        });
      }

      // ============================================================
      // 初始化
      // ============================================================
      function init() {
        if (!loadFromLocalStorage()) state = createInitialState();
        initCity();
        updateWeatherCanvas();
        fullRender();
        bindEvents();
        setInterval(tick, 1000);
        setInterval(saveToLocalStorage, 30000);
        if (state.lastLat != null && state.lastLon != null) fetchWeatherByCoords(state.lastLat, state.lastLon);
        setInterval(() => {
          if (state.lastLat != null && state.lastLon != null) fetchWeatherByCoords(state.lastLat, state.lastLon);
        }, WEATHER_CACHE_TTL);
        console.log('🌤️ 像素天气农场 · 扩展版已加载！');
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
